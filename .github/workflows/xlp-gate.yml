name: XLP Strict Enforcement Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  xlp-gate:
    name: Strict Architectural, Research, Testing & Documentation Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11+
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and verify Git hooks
        run: |
          ./scripts/install-hooks.sh
          ./xlp-gate verify-hooks

      - name: Run xlp-gate in strict mode with live test execution
        run: |
          ./xlp-gate check --strict --run-tests --json-out gate-report.json

      - name: Upload XLP Gate Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xlp-gate-report
          path: gate-report.json
          retention-days: 30
